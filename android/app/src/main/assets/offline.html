<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >


<title>Rigel — Offline</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
        background: #120B07;
        color: #F5EFE6;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Background glow */
    .glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: rgba(201, 162, 39, 0.08);
        filter: blur(70px);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    /* Decorative circles */
    .circle {
        position: absolute;
        border: 1px solid rgba(201, 162, 39, 0.12);
        border-radius: 50%;
    }

    .circle.one {
        width: 320px;
        height: 320px;
        top: -100px;
        right: -100px;
    }

    .circle.two {
        width: 250px;
        height: 250px;
        bottom: -100px;
        left: -80px;
    }

    .container {
        position: relative;
        z-index: 5;
        width: 100%;
        max-width: 430px;
        padding: 30px;
        text-align: center;
    }

    /* Logo circle */
    .logo-wrapper {
        width: 180px;
        height: 180px;
        margin: 0 auto 30px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
            radial-gradient(
                circle at center,
                #21150D 0%,
                #160D08 65%,
                #100905 100%
            );

        border: 2px solid rgba(201, 162, 39, 0.65);

        box-shadow:
            0 0 0 8px rgba(201, 162, 39, 0.04),
            0 0 35px rgba(201, 162, 39, 0.18),
            inset 0 0 30px rgba(201, 162, 39, 0.08);

        animation: pulse 2.4s ease-in-out infinite;
    }

    .logo {
        width: 135px;
        height: 135px;
        object-fit: contain;

        animation: zoom 2.4s ease-in-out infinite;
    }

    @keyframes zoom {
        0% {
            transform: scale(0.94);
        }

        50% {
            transform: scale(1.06);
        }

        100% {
            transform: scale(0.94);
        }
    }

    @keyframes pulse {
        0% {
            box-shadow:
                0 0 0 8px rgba(201, 162, 39, 0.04),
                0 0 25px rgba(201, 162, 39, 0.12),
                inset 0 0 30px rgba(201, 162, 39, 0.06);
        }

        50% {
            box-shadow:
                0 0 0 14px rgba(201, 162, 39, 0.03),
                0 0 45px rgba(201, 162, 39, 0.22),
                inset 0 0 35px rgba(201, 162, 39, 0.10);
        }

        100% {
            box-shadow:
                0 0 0 8px rgba(201, 162, 39, 0.04),
                0 0 25px rgba(201, 162, 39, 0.12),
                inset 0 0 30px rgba(201, 162, 39, 0.06);
        }
    }

    .brand {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 5px;
        color: #C9A227;
        text-transform: uppercase;
        margin-bottom: 14px;
    }

    h1 {
        font-size: 28px;
        line-height: 1.2;
        font-weight: 700;
        margin-bottom: 12px;
        color: #F5EFE6;
    }

    .message {
        max-width: 320px;
        margin: 0 auto 28px;

        font-size: 15px;
        line-height: 1.6;

        color: rgba(245, 239, 230, 0.65);
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;

        padding: 9px 15px;
        margin-bottom: 24px;

        border-radius: 999px;

        background: rgba(201, 162, 39, 0.08);
        border: 1px solid rgba(201, 162, 39, 0.18);

        font-size: 13px;
        color: #E8D49A;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #C9A227;

        box-shadow: 0 0 10px rgba(201, 162, 39, 0.7);

        animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
        0%,
        100% {
            opacity: 1;
        }

        50% {
            opacity: 0.35;
        }
    }

    button {
        width: 100%;
        max-width: 260px;

        padding: 14px 22px;

        border: none;
        border-radius: 12px;

        background: linear-gradient(
            135deg,
            #C9A227,
            #E8D49A
        );

        color: #120B07;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        box-shadow:
            0 8px 25px rgba(201, 162, 39, 0.18);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    button:active {
        transform: scale(0.97);
    }

    .footer {
        margin-top: 32px;

        font-size: 11px;
        letter-spacing: 1.5px;

        color: rgba(245, 239, 230, 0.3);
    }
</style>


</head>

<body>


<div class="glow"></div>

<div class="circle one"></div>
<div class="circle two"></div>

<main class="container">

    <div class="logo-wrapper">
        <img
            src="./RIGELLOG.PNG"
            alt="Rigel"
            class="logo"
        >
    </div>

    <div class="brand">
        RIGEL
    </div>

    <h1>
        You're offline
    </h1>

    <p class="message">
        We can't connect to Rigel right now.
        Please check your internet connection and try again.
    </p>

    <div class="status">
        <span class="status-dot"></span>
        No internet connection
    </div>

    <br>

    <button onclick="tryAgain()">
        Try Again
    </button>

    <div class="footer">
        CAR RENTAL &amp; APPARTEMENT
    </div>

</main>

<script>
    function tryAgain() {
        window.location.href = "https://rigelcars.com";
    }
</script>


</body>
</html>
