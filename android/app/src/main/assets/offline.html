<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rigel - No Connection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #120B07;
            color: #F5EFE6;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 360px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 42px;
            font-weight: bold;
            color: #C9A227;
            letter-spacing: 5px;
        }

        h1 {
            font-size: 23px;
            margin-top: 35px;
        }

        p {
            color: rgba(245, 239, 230, 0.7);
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            background: #C9A227;
            color: #120B07;
            font-size: 16px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">RIGEL</div>

    <h1>No Internet Connection</h1>

    <p>
        We couldn't connect to Rigel.
        Please check your internet connection and try again.
    </p>

    <button onclick="retry()">
        Try Again
    </button>

</div>

<script>
    function retry() {
        window.location.href = "https://rigelcars.com";
    }
</script>

</body>
</html>
